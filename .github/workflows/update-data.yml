name: Update EPL data

# Runs the scrapers automatically and commits the refreshed database.
# Railway (or any host watching this repo) picks up the push and redeploys
# with fresh data - no manual step needed once this is set up.

on:
  schedule:
    # Weekly, Monday 06:00 UTC - covers the whole prior gameweek plus
    # anything from midweek games. Simpler than trying to time this around
    # cup/European draws - it doesn't need to: cup_fixtures.py is edited
    # by hand whenever a draw happens, and this workflow just re-loads
    # whatever's currently in that file each run, so there's no scheduling
    # dependency between the two.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}  # lets you click "Run workflow" in GitHub's UI on demand

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run FPL scraper (required)
        run: cd backend && python fpl_scraper.py

      - name: Run FBref scraper (best-effort - don't fail the job if FBref blocks/changes layout)
        run: cd backend && python fbref_scraper.py || echo "FBref scrape failed, continuing with FPL data only"

      - name: Load cup/European fixtures (manual, from cup_fixtures.py, whatever's checked in)
        run: cd backend && python load_cup_fixtures.py

      - name: Run Champions League + FA Cup + Carabao Cup scraper (UCL needs FOOTBALL_DATA_API_KEY secret, skips gracefully if not set; FA Cup/Carabao Cup need no key)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: cd backend && python cup_fixtures_scraper.py || echo "Cup scrape failed, continuing without it"

      - name: Run odds scraper (needs ODDS_API_KEY secret - skips gracefully if not set)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: cd backend && python odds_scraper.py || echo "Odds scrape failed, continuing without odds"

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/epl.db
          git diff --staged --quiet || git commit -m "Auto-update EPL data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
