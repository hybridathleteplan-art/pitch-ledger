name: Update EPL data

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run FPL scraper
        run: cd backend && python fpl_scraper.py

      - name: Commit and push updated database
        run: |
          git config user.name "hybridathleteplan-art"
          git config user.email "hybridathleteplan-art@users.noreply.github.com"
          git add backend/epl.db
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Auto-update EPL data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin ${{ github.ref_name }} || true
          git push
